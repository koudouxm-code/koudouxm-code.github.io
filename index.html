
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Chez OLAF</title>
<meta name="description" content="Découvrez la collection exclusive de Chez OLAF : chaussures, bijoux, tenues.">
<style>
  :root {
    --encre: #141414;
    --gris: #6B6B6B;
    --trait: #E2E2E2;
    --fond-page: #FFFFFF;
    --fond-doux: #F7F7F5;
    --rayon: 16px;
  }
  html, body, div, section, main, nav, footer, a, p, span, button, h1, h2, h3 { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond-doux);
    color: var(--encre);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .page { max-width: 1000px; margin: 0 auto; background: var(--fond-page); min-height: 100vh; }
  a:focus-visible, button:focus-visible { outline: 3px solid #C58F2C; outline-offset: 2px; }

  .banniere { position: relative; overflow: hidden; min-height: 220px; background: #1F3B3A; }
  .piste {
    position: relative;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .piste::-webkit-scrollbar { display: none; }
  .slide {
    position: relative;
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: block;
    aspect-ratio: 2 / 1;
    min-height: 220px;
    max-height: 440px;
    width: 100%;
    background: var(--fond, #1F3B3A);
    overflow: hidden;
  }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slide::after { content: ""; position: absolute; inset: 0; background: rgba(12, 30, 28, .38); }
  .etiquette {
    position: absolute; left: 14px; bottom: 14px; z-index: 2;
    background: rgba(255,255,255,.94);
    color: var(--encre);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: .85rem;
    display: flex; gap: 8px;
  }
  .etiquette strong { font-weight: 700; }

  .titre-banniere {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff;
    padding: 0 20px 24px;
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.35);
  }
  .titre-banniere h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    font-weight: 700;
    margin: 0;
    line-height: 1.1;
  }
  .titre-banniere p { margin: 6px 0 0; font-size: clamp(.9rem, 2.6vw, 1.1rem); }

  .fleche {
    position: absolute; top: 50%; z-index: 4;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border: 0; border-radius: 50%;
    background: rgba(255,255,255,.85);
    color: var(--encre);
    font-size: 1.3rem; line-height: 1;
    cursor: pointer;
  }
  .fleche.prec { left: 8px; }
  .fleche.suiv { right: 8px; }
  .points { position: absolute; right: 8px; bottom: 6px; z-index: 4; display: flex; }
  .point {
    width: 24px; height: 24px; padding: 0; border: 0; background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .point::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,.6);
  }
  .point[aria-current="true"]::before { background: #fff; width: 11px; height: 11px; }

  .barre {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: var(--fond-page);
    padding: 12px 16px;
    border-bottom: 1px solid #F0F0F0;
  }
  .categories { display: flex; gap: 10px; flex: 1; overflow-x: auto; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }
  .categories button {
    flex: none;
    border: 1px solid var(--trait);
    background: #fff;
    color: var(--encre);
    font: inherit; font-size: .95rem; font-weight: 500;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
  }
  .categories button[aria-pressed="true"] { background: var(--encre); color: #fff; border-color: var(--encre); }
  .panier { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--encre); }
  .panier svg { width: 26px; height: 26px; }

  main { padding: 8px 16px 40px; }
  main h2 { font-size: 1.3rem; font-weight: 700; margin: 18px 0 14px; }
  .grille { display: grid; gap: 22px 16px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 720px) { .grille { grid-template-columns: repeat(3, 1fr); } }
  .carte { display: block; color: inherit; text-decoration: none; }
  .vignette {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: var(--rayon);
    overflow: hidden;
    background: var(--fond, #1F3B3A);
  }
  .vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vignette.sans-image::after {
    content: attr(data-nom);
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 12px; text-align: center;
    color: #fff; font-weight: 600;
  }
  .carte .nom { margin: 10px 0 0; color: var(--gris); font-size: 1rem; }
  .carte .prix { margin: 2px 0 0; font-weight: 700; font-size: 1.05rem; }
  .carte:hover .nom { text-decoration: underline; }
  .vide { color: var(--gris); padding: 20px 0; }
  footer { text-align: center; color: var(--gris); font-size: .85rem; padding: 0 16px 28px; }
  @media (prefers-reduced-motion: reduce) { .piste { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="page">

  <section class="banniere" aria-roledescription="carrousel" aria-label="Produits à la une">
    <div class="piste" id="piste"></div>
    <div class="titre-banniere">
      <h1>Chez OLAF</h1>
      <p>Découvrez notre collection exclusive</p>
    </div>
    <button class="fleche prec" id="prec" aria-label="Produit précédent">&#8249;</button>
    <button class="fleche suiv" id="suiv" aria-label="Produit suivant">&#8250;</button>
    <div class="points" id="points"></div>
  </section>

  <div class="barre">
    <nav class="categories" id="categories" aria-label="Catégories"></nav>
    <a class="panier" href="panier.html" aria-label="Voir mon panier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 7H6"/>
        <circle cx="10" cy="20.5" r="1.2"/><circle cx="18" cy="20.5" r="1.2"/>
      </svg>
    </a>
  </div>

  <main>
    <h2>Nos Produits</h2>
    <div class="grille" id="grille"></div>
    <p class="vide" id="vide" hidden>Aucun produit dans cette catégorie pour le moment.</p>
  </main>

  <footer>&copy; Chez OLAF</footer>
</div>

<script>
